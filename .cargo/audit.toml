[advisories]
# Both crates reach Cargo.lock only because sqlx lists all of its drivers
# for its macros; Cairn enables only sqlx's Postgres driver, and neither
# crate is compiled for any target or feature (`cargo tree -i <crate>
# --all-features --target all` is empty). Re-check when upgrading sqlx.
#
# RUSTSEC-2023-0071: rsa via sqlx-mysql (Marvin timing attack; no fixed release).
# RUSTSEC-2026-0459: libsqlite3-sys via sqlx-sqlite (bundled SQLite CVE).
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0459"]
